[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "introspection-examples"
version = "0.1.0"
description = "Examples demonstrating Introspection SDK integrations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# Core dependencies only
dependencies = [
    "introspection-sdk",
    "openai>=1.0.0",
    "opentelemetry-sdk>=1.39.0,<1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
logfire = [
    "logfire>=4.23.0",
]
all = [
    "introspection-examples[logfire]",
]

[tool.hatch.build.targets.wheel]
packages = ["introspection_examples"]

[tool.uv.sources]
introspection-sdk = { path = "..", editable = true }

[tool.ruff]
extend = "../pyproject.toml"
