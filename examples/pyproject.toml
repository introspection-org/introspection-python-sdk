[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "introspection-examples"
version = "0.1.0"
description = "Examples demonstrating Introspection SDK integrations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "introspection-sdk",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["introspection_examples"]

[tool.uv.sources]
introspection-sdk = { path = "..", editable = true }

[tool.ruff]
extend = "../pyproject.toml"
