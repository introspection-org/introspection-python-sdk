[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "introspection-examples"
version = "0.1.0"
description = "Examples demonstrating Introspection SDK integrations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "introspection-aauth[fastapi]",
    "introspection-sdk[otel]",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["introspection_examples"]

[tool.uv.sources]
introspection-aauth = { path = "../packages/introspection-aauth", editable = true }
introspection-sdk = { path = "..", editable = true }

[tool.ruff]
extend = "../pyproject.toml"

# A docs region that shows a snippet's imports at module level sits below
# the load_dotenv() / env-var check the docs leave out.
[tool.ruff.lint.per-file-ignores]
"introspection_examples/reference/*.py" = ["E402"]
