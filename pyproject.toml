[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "introspection-sdk"
version = "0.31.0"
description = "Python SDK for Introspection — continuously improve your AI systems with production feedback and frontier practices"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "ag-ui-protocol>=0.1.19,<0.2.0",
    "httpx2>=2.12.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
# Opt-in dependency for the Arrow list-read decode path (`format="arrow"`).
# Kept out of the core deps so the default REST install stays light; the JSON
# path never imports pyarrow. Install with `pip install introspection-sdk[arrow]`.
arrow = ["pyarrow>=14.0.0"]
# Compatibility transport for libraries that have not migrated to httpx2 yet
# (notably Harbor 0.20 and the current E2B Python SDK).
proxy-httpx = ["httpx>=0.27.0,<1"]
# Install with `pip install introspection-sdk[otel]` to enable the
# OpenTelemetry exporter, `IntrospectionSpanProcessor`, and the
# IntrospectionLogs (track / feedback / identify) surface. Default
# install is REST-only (client.runtimes / client.experiments / Runner
# / tasks / files).
otel = [
    "opentelemetry-sdk >= 1.39.0, < 1.43.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39.0,<1.43.0",
]
# unasync is pinned: scripts/gen_sync.py generates introspection_sdk/_sync/
# and CI fails on any diff, so a new release must not change its output.
dev = [
    "griffe>=2.3.2",
    "mypy>=2.4.0",
    "pre-commit>=3.5.0",
    "ruff==0.14.14",
    "ty>=0.0.7",
    "unasync==0.6.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pydantic>=2.12.0",
    "inline-snapshot>=0.31.0",
    "dirty-equals>=0.11.0",
    "responses>=0.25.8",
    "jsonschema>=4.23.0",
    "trustme>=1.2.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["introspection_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/introspection_sdk"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# Preview is on only for rules selected by exact code (PLR0917 below):
# `explicit-preview-rules` keeps prefixes like "E" or "F" from pulling in
# preview rules. It does still turn on preview behaviour of stable rules
# (F822, for one, then checks submodules listed in `__all__`).
preview = true
explicit-preview-rules = true
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "TID252", # relative imports
    # Complexity ratchet: see "Complexity ratchet" in AGENTS.md.
    "C901",    # mccabe complexity
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments (preview)
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults
]

# Ratchet: each threshold is today's worst value. Lower it as offenders
# are refactored, down to the target in AGENTS.md. Never raise it.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 20 # target 10

[tool.ruff.lint.pylint]
max-branches = 20       # target 12
max-statements = 53     # target 50
max-returns = 10        # target 6
max-positional-args = 5 # target 5 (PLR0917, preview)

[tool.ruff.lint.per-file-ignores]
# Generated by scripts/gen_sync.py: the `for x in it: yield x` and
# `[x for x in it]` an `async for` leaves behind stay as written.
"introspection_sdk/_sync/**" = ["UP028", "C416"]
# A test suite imports its own helpers relatively.
"**/tests/**" = ["TID252"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# mypy checks only that the client and the Runner satisfy the data-plane
# Protocols; ty, which checks everything else, does not verify protocol
# members yet.
[tool.mypy]
files = ["introspection_sdk/protocols.py", "tests/rest/test_dataplane_protocols.py"]
follow_imports = "silent"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: requires real API keys and makes live API calls",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
source = ["introspection_sdk"]
branch = true
omit = [
    "introspection_sdk/version.py",
    "introspection_sdk/__init__.py",
]

[tool.coverage.report]
# Ratchet: this floor moves up as new tests land. Do not lower it.
# Relaxed to 60 to land the REST + OTel split; ratcheted back up to 80
# once the REST/runner surface, the span processor, and the IntrospectionLogs
# surface gained request/response-backed tests.
fail_under = 80
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
precision = 1

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "inline-snapshot[black]>=0.32.5",
]

# deptry: unused (DEP002), missing (DEP001), transitive (DEP003) and
# misplaced dev (DEP004) dependencies. Run with `uv run deptry .`.
[tool.deptry]
# examples/ is its own uv project with its own pyproject.toml and lock.
# tests/ stays excluded (deptry's default): it imports the dev/test tools,
# which would read as dev dependencies leaking into shipped code (DEP004).
# packages/ holds its own distributions, each with its own [tool.deptry].
extend_exclude = ["examples", "packages"]
known_first_party = ["introspection_sdk"]
# The `dev` and `test` extras are tooling, not runtime dependencies.
optional_dependencies_dev_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# scripts/gen_sync.py (a code generator) and scripts/griffe_reexports.py (a
# griffe extension for the API check) run in development and CI only, never
# shipped, so the dev dependencies they import are in the right place.
DEP004 = ["griffe", "unasync"]
