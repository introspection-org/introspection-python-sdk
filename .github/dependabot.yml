version: 2

updates:
  # ── Python dependencies (pyproject.toml + uv.lock) ──
  # `uv` reads uv.lock. packages/introspection-aauth and introspection-atif are
  # each their own uv project, not a workspace member; one entry with both directories opens one PR per group
  # across them. The root's dev tools are optional-dependency extras, which
  # Dependabot types as production, so groups match by name, not dependency-type.
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/packages/introspection-aauth"
      - "/packages/introspection-atif"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      otel:
        applies-to: version-updates
        patterns:
          - "opentelemetry-*"
      # 0.x tools whose "minor" bumps change output; CI gates the one PR.
      lint-tooling:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "ty"
          - "pre-commit"
      dev-tooling:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "pytest*"
          - "vcrpy"
          - "responses"
          - "trustme"
          - "jsonschema"
          - "inline-snapshot"
          - "dirty-equals"
          - "griffe"
          - "mypy"
          - "deptry"
          - "unasync"
      dev-tooling-major:
        applies-to: version-updates
        update-types: ["major"]
        patterns:
          - "pytest*"
          - "vcrpy"
          - "responses"
          - "trustme"
          - "jsonschema"
          - "inline-snapshot"
          - "dirty-equals"
          - "griffe"
          - "mypy"
          - "deptry"
          - "unasync"
      runtime:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
      # Runtime majors stay ungrouped: each changes what SDK users install.
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # ty 0.0.104 reports 51 errors on this tree; held until they are fixed.
      - dependency-name: "ty"
        versions: [">0.0.23"]

  # examples/ is its own uv project and is not shipped: one monthly PR.
  - package-ecosystem: "uv"
    directory: "/examples"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      examples:
        patterns:
          - "*"

  # ── GitHub Actions (used by ci.yml / publish.yml / tag.yml) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
