version: 2

updates:
  # ── Python dependencies (pyproject.toml + uv.lock) ──
  # `uv` reads uv.lock; `pip` opened no version update here. examples/ and
  # packages/introspection-aauth are their own uv projects, not workspace members.
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/examples"
      - "/packages/introspection-aauth"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # OpenTelemetry runtime + exporter deps move as a fleet.
      otel:
        applies-to: version-updates
        patterns:
          - "opentelemetry-*"
      otel-security:
        applies-to: security-updates
        patterns:
          - "opentelemetry-*"

      # Test toolchain — pytest family + helpers.
      test-tooling:
        applies-to: version-updates
        patterns:
          - "pytest*"
          - "inline-snapshot"
          - "dirty-equals"
          - "responses"
          - "pydantic"
      test-tooling-security:
        applies-to: security-updates
        patterns:
          - "pytest*"
          - "inline-snapshot"
          - "dirty-equals"
          - "responses"
          - "pydantic"

      # Lint / format / typecheck.
      lint-tooling:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "ty"
          - "pre-commit"
      lint-tooling-security:
        applies-to: security-updates
        patterns:
          - "ruff"
          - "ty"
          - "pre-commit"

      # Catch-all for security alerts not matching a more specific group.
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"
    # No blanket ignore of majors: it hid ag-ui-protocol 1.0, and
    # dependabot-auto-merge.yml already leaves majors for a person to merge.

  # ── GitHub Actions (used by ci.yml / publish.yml / tag.yml) ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
