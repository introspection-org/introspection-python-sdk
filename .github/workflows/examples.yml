name: Examples

# Examples start real runtime tasks, so they're NOT run on every push.
#
# Triggers:
#   - workflow_dispatch  → manual run from the Actions UI / `gh workflow run`
#   - push of a v* tag   → verify release-time before publish picks up

on:
  workflow_dispatch:
    inputs:
      run_examples:
        description: "Run the REST API examples"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-examples:
    name: Run examples
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-examples-${{ hashFiles('examples/pyproject.toml', 'examples/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-examples-

      - name: Run pattern examples
        # The docs' pattern pages show these modules' snippet regions.
        # patterns.add_to_your_app and patterns.web_chat also need a service
        # account (the INTRO_SA_* secrets api/service_account.py reads); they
        # print a skip message and exit 0 when those secrets are unset.
        if: inputs.run_examples || startsWith(github.ref, 'refs/tags/v')
        working-directory: examples
        env:
          INTROSPECTION_TOKEN: ${{ secrets.INTROSPECTION_TOKEN }}
          INTROSPECTION_API_KEY: ${{ secrets.INTROSPECTION_TOKEN }}
          INTROSPECTION_SERVICE_ACCOUNT_CLIENT_ID: ${{ secrets.INTRO_SA_CLIENT_ID }}
          INTROSPECTION_SERVICE_ACCOUNT_CLIENT_SECRET: ${{ secrets.INTRO_SA_CLIENT_SECRET }}
          INTROSPECTION_PROJECT: ${{ secrets.INTRO_PROJECT }}
          INTROSPECTION_BASE_API_URL: ${{ vars.INTROSPECTION_BASE_API_URL || 'https://api.introspection.dev' }}
        run: |
          uv run -m introspection_examples.patterns.add_to_your_app
          uv run -m introspection_examples.patterns.web_chat
          uv run -m introspection_examples.observe.feedback_events
          uv run -m introspection_examples.identity.agents
          uv run -m introspection_examples.identity.sharing
          uv run -m introspection_examples.patterns.agent_follow_ups
          uv run -m introspection_examples.patterns.approve_outside
          uv run -m introspection_examples.patterns.ask_the_user
          uv run -m introspection_examples.patterns.files
          uv run -m introspection_examples.patterns.multi_tenant
          uv run -m introspection_examples.patterns.per_user_tools
          uv run -m introspection_examples.patterns.structured_output
          uv run -m introspection_examples.patterns.trigger

      - name: Run examples
        # Also runs on the v* tag push this workflow declares a trigger for,
        # where `inputs` is empty.
        if: inputs.run_examples || startsWith(github.ref, 'refs/tags/v')
        working-directory: examples
        env:
          INTROSPECTION_TOKEN: ${{ secrets.INTROSPECTION_TOKEN }}
          # An unset repository variable expands to an empty string, which
          # overrides the SDK's documented production default and leaves httpx
          # with a URL that has no scheme. Preserve the configurable target,
          # but make an unconfigured release workflow use the same default as
          # the examples themselves.
          INTROSPECTION_BASE_API_URL: ${{ vars.INTROSPECTION_BASE_API_URL || 'https://api.introspection.dev' }}
          # reference.auth_service_account needs a service account (the
          # INTRO_SA_* secrets); reference.python_run_task needs a
          # `support-agent` runtime, which its docs region names; and
          # reference.auth_hosted_login needs a browser redirect's code. Each
          # prints a skip message and exits 0 without its prerequisite.
          INTROSPECTION_SERVICE_ACCOUNT_CLIENT_ID: ${{ secrets.INTRO_SA_CLIENT_ID }}
          INTROSPECTION_SERVICE_ACCOUNT_CLIENT_SECRET: ${{ secrets.INTRO_SA_CLIENT_SECRET }}
          INTROSPECTION_PROJECT: ${{ secrets.INTRO_PROJECT }}
        run: |
          uv run -m introspection_examples.api.runtimes
          uv run -m introspection_examples.api.async_runtimes
          uv run -m introspection_examples.api.repositories
          uv run -m introspection_examples.api.conversation_atif
          uv run -m introspection_examples.otel.log_event
          uv run -m introspection_examples.reference.auth_api_key
          uv run -m introspection_examples.reference.python_sdk
          uv run -m introspection_examples.reference.python_run_task
          uv run -m introspection_examples.reference.auth_service_account
          uv run -m introspection_examples.reference.auth_hosted_login
