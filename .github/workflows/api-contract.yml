# Watches the published API reference for drift against this SDK's task-create
# body. Scheduled rather than run on pull requests: it reaches the network and
# it goes red when the *server* changes, which is a fact about the world and not
# about the commit under review. Gating PRs on it would make it noise, and noise
# is how the last one of these went unnoticed.
name: API Contract

on:
  schedule:
    # 07:00 UTC daily, so a red run is waiting at the start of the day rather
    # than arriving mid-afternoon.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-create:
    name: TaskCreate vs published reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compare TaskCreate against the reference
        run: uv run python scripts/check_api_contract.py
