name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run ty check

      - name: Check the client and Runner share the data-plane Protocols
        run: uv run mypy

  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=introspection_sdk --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  examples-check:
    # examples.yml runs the examples only by hand and on tags, since they
    # start real tasks. This checks every file under examples/ on each PR
    # without running it: it compiles, its imports resolve, and its
    # `# #region docs:` markers (extracted by the docs site) are paired and
    # unique. Root `ruff` and `ty check` above already cover examples/.
    name: Examples Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-examples-${{ hashFiles('examples/pyproject.toml', 'examples/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-examples-

      - name: Check examples compile, resolve imports, and pair docs regions
        run: uv run --project examples python scripts/check_examples.py

  api-compat:
    # Fails a PR that breaks the public API against the latest v* release
    # (scripts/check_api.py, griffe). To break it on purpose, see "Public API
    # compatibility" in AGENTS.md: a `!` in the PR title plus the `api-break`
    # label. The label is read at run time, not from the event payload, so
    # re-running this job after a maintainer adds it is enough.
    name: API Compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags and the history that reaches them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check for breaking changes against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if uv run python scripts/check_api.py; then
            exit 0
          fi
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json title,labels)
          title=$(jq -r .title <<<"$pr")
          if ! jq -e '.labels | any(.name == "api-break")' <<<"$pr" >/dev/null; then
            exit 1
          fi
          if [[ ! "$title" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            echo "::error::The api-break label needs a breaking PR title" \
              "such as 'feat!: ...', so release-please bumps the version."
            exit 1
          fi
          echo "::warning::Breaking API change accepted by the api-break label."

  # Examples live in their own workflow (./examples.yml) so they don't burn
  # LLM tokens on every push. They run on `workflow_dispatch` + tag pushes.
