name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    environment: build
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run linting
        run: uv run ruff check .

      # introspection_sdk/_sync/ is generated from introspection_sdk/_async/
      # by scripts/gen_sync.py; see "Sync code generation" in AGENTS.md.
      - name: Check the generated sync code is up to date
        run: |
          uv run python scripts/gen_sync.py
          git diff --exit-code -- introspection_sdk/_sync
          untracked=$(git ls-files --others --exclude-standard introspection_sdk/_sync)
          if [ -n "$untracked" ]; then
            echo "Generated but not committed: $untracked"
            exit 1
          fi

      - name: Run type checking
        run: uv run ty check

      - name: Check the client and Runner share the data-plane Protocols
        run: uv run mypy

  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    environment: build
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=introspection_sdk --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  examples-check:
    # examples.yml runs the examples only by hand and on tags, since they
    # start real tasks. This checks every file under examples/ on each PR
    # without running it: it compiles, its imports resolve, and its
    # `# #region docs:` markers (extracted by the docs site) are paired and
    # unique. Root `ruff` and `ty check` above already cover examples/.
    name: Examples Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-examples-${{ hashFiles('examples/pyproject.toml', 'examples/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-examples-

      - name: Check examples compile, resolve imports, and pair docs regions
        run: uv run --project examples python scripts/check_examples.py

  # Examples live in their own workflow (./examples.yml) so they don't burn
  # LLM tokens on every push. They run on `workflow_dispatch` + tag pushes.

  deptry:
    # Unused, missing, transitive and misplaced dev dependencies of
    # introspection_sdk/ and scripts/, configured in [tool.deptry] in
    # pyproject.toml. Local equivalent: `uv run deptry .`.
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # deptry maps each declared distribution to its import names from the
      # installed metadata, so every extra has to be installed.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check dependencies
        run: uv run deptry .

  duplication:
    # Duplicate-code ratchet: fails when the duplicated-lines share of
    # introspection_sdk/ exceeds `threshold` in .jscpd.json. Lower the
    # threshold when a refactor removes duplication; never raise it.
    name: Duplicate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Duplicate code stays under the threshold
        run: npx --yes jscpd@5.4.1

  all-green:
    # The one check the branch ruleset requires from this workflow, next to
    # the separate "API Compatibility" workflow. Add every new job here to
    # `needs`. A job skipped because a job it needs failed (Unit Tests after
    # Lint & Type Check) fails the gate. No job skips by design today, so
    # there is no `allowed-skips`.
    name: All green
    if: always()
    needs:
      - secrets-scan
      - lint-actions
      - lint
      - test
      - examples-check
      - deptry
      - duplication
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
