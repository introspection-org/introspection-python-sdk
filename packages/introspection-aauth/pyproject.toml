[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "introspection-aauth"
version = "1.0.0"
description = "An AAuth Person Server and Access Server (draft-hardt-oauth-aauth-protocol -11): missions, person and auth tokens, budgets, approvals and four-party federation, over a store you provide"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "cryptography>=44.0.0",
    "http-sfv>=0.9.9",
    "httpx2>=2.12.0",
    "opentelemetry-api>=1.39.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115.0"]
test = [
    # Only to check that what this package signs verifies under the data
    # plane's current verifier; the package itself does not use it.
    "aauth-signing==0.2.0",
    "opentelemetry-sdk>=1.39.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["introspection_aauth"]

[tool.hatch.build.targets.sdist]
include = ["/README.md", "/introspection_aauth"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["introspection_aauth"]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true
precision = 1

[tool.deptry]
known_first_party = ["introspection_aauth"]
optional_dependencies_dev_groups = ["test"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "ruff==0.14.14",
    "ty>=0.0.7",
]
